plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "28.2.13676358"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = "b844bc4"
def gitCommitCount = 1091
try {
    def commit = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
    if (commit) gitCommitId = commit
    def count = 'git rev-list --count HEAD'.execute([], project.rootDir).text.trim()
    if (count) gitCommitCount = Integer.parseInt(count)
} catch (Throwable ignored) {
}
def baseVersionName = "${api_version_major}.6.0"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}
